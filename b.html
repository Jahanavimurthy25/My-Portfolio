<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Basics</title>
</head>

<body>

<h2>JavaScript Variables, Functions and Objects&1e experiment</h2>

<button onclick="display()">Submit</button>

<script>

    // Object
    let student = {
        name: "Janu",
        age: 20,
        course: "CSE-AI",
    };

    // Function
    function display() {
        document.write(
            "Name: " + student.name +
            "<br>Age: " + student.age +
            "<br>Course: " + student.course
        );
    }

</script>

</body>
</html>
